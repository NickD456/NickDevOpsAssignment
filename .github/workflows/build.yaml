name: Run Build
env:
  UPLOAD_TOKEN: 'dummyToken'
on:
  workflow_dispatch:
    inputs:
      customFileName:
        description: 'Enter a custome name for the built APK'
        type: string
        default: 'TestApp'
      buildPlatformAndroid:
        description: 'Build to Android?'
        type: boolean
        required: true
        defualt: false
      buildPlatformIOS:
        description: 'Build to IOS?'
        type: boolean
        required: true
        defualt: false

      

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Make file executable
        run:  chmod +x build.sh upload.sh
      
      - name: Start timer
        id: timer_start
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT
        
      # CLI call to simulated build process
      - name: Run Build
        run: |
          ./build.sh --platform Android --project-name "${{github.event.inputs.customFileName}}" --profile

      - name: Stop timer
        id: timer_end
        run: |
          end=$(date +%s)
          duration=$((end - ${{ steps.timer_start.outputs.start }}))
          echo "Build took ${duration} seconds"
      
      - name: Upload profiling artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-profiles
          path: cli/build/Android/*.pro

      # CLI call to simulated upload process
      - name: Version tagging
        if: github.ref == 'refs/heads/main'
        id: auto_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          
      - name: Rename APK and upload
        if: github.ref == 'refs/heads/main'
        run: |
          APK_PATH="build/Android/${{ github.event.inputs.customFileName }}.apk"
          mv "$APK_PATH" "build/Android/${{ github.event.inputs.customFileName }}-${{ steps.auto_version.outputs.new_tag }}.apk"
    
          for file in build/Android/*; do
            ./upload.sh android "$file"
          done
