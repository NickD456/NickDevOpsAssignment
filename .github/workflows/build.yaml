name: Run Build
env:
  UPLOAD_TOKEN: 'dummyToken'
on:
  workflow_dispatch:
    inputs:
      customFileName:
        description: 'Enter a custome name for the built APK'
        type: string
        default: 'TestApp'

      majorRelease:
        description: 'Is this a major release?'
        type: boolean
        default: false
      

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Make file executable
        run:  chmod +x build.sh upload.sh
        
      # CLI call to simulated build process
      - name: Run Build
        run: |
          ./build.sh --platform Android --project-name "${{github.event.inputs.customFileName}}"

      # CLI call to simulated upload process
      - name: Upload and version
        if: github.ref == 'refs/heads/Test'
        run: |
          LastTag =$(git describe --tags --abbrev=0 || echo "v0.0")
          Major=$(echo $LastTag | cut -d. -f1 | tr -d v)
          Minor=$(echo $LastTag | cut -d. -f2)

          if [ "${{ github.event.inputs.majorRelease }}" == "true" ]; then
            Major=$((Major + 1))
            Minor=0
          else
            Minor=$((Minor + 1))
          fi

          Version="v${Major}.${Minor}"
          echo "Version=$VERSION" >> $GITHUB_ENV
          echo "Determined version: Version"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          
          for file in build/Android/*; do
            ./upload.sh android "$file"
          done
